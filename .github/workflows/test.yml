name: Test

on:
  push:
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.py'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: make test